name: Release

permissions:
  contents: write # For creating releases
  packages: write # For pushing the image to ghcr.io
  pull-requests: read # For building changelog from PRs with labels

on:
  push:
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build changelog from PRs with labels
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: ".github/changelog-configuration.json"
          # PreReleases still get a changelog, but the next full release gets a diff since the last full release,
          # combining possible changelogs of all previous PreReleases in between.
          # PreReleases show a partial changelog since last PreRelease.
          # It is assumed that PreReleases have a '-' in their tag name, e.g. 'v1.0.0-alpha.1'.
          # `github.ref` is in the format of 'refs/tags/v1.0.0-alpha.1' for tags.
          ignorePreReleases: "${{ !contains(github.ref, '-') }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          # It is assumed that PreReleases have a '-' in their tag name, e.g. 'v1.0.0-alpha.1'.
          # `github.ref` is in the format of 'refs/tags/v1.0.0-alpha.1' for tags.
          prerelease: "${{ contains(github.ref, '-') }}"
          token: ${{ secrets.GITHUB_TOKEN }}
